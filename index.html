<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b5d3b">
<title>تذاكر الكرة العراقية · حجز التذاكر ثلاثي الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <header class="topbar glass">
    <div class="brand"><span class="logo"></span><div><b id="stName"></b><small id="stSub"></small></div></div>
    <div class="fixture">
      <div class="teams"><span id="fxHomeDot" class="crest"></span><span id="fxHome"></span><em>×</em><span id="fxAway"></span><span id="fxAwayDot" class="crest"></span></div>
      <small id="fxMeta"></small>
    </div>
    <div class="actions">
      <button id="soundBtn" class="chip snd" aria-label="Sound"></button>
      <button id="venuesBtn" class="chip"></button>
      <button id="langBtn" class="chip" aria-label="Language">EN</button>
      <button id="basketBtn" class="chip basket"><span id="basketIcon"></span><span id="basketLabel"></span><b id="basketCount">0</b></button>
    </div>
  </header>

  <nav class="crumbs glass" id="crumbs" aria-label="Breadcrumb"></nav>

  <aside class="legend glass" id="legend"><button id="legendToggle" class="legend-toggle"></button><div id="legendBody"></div></aside>

  <div class="minimap glass">
    <div class="mini-head"><span id="miniTitle"></span><div class="compass"><div id="needle"><i></i></div><b id="compassN">N</b></div></div>
    <canvas id="mini" width="440" height="300"></canvas>
  </div>

  <div id="tooltip" class="glass"></div>
  <section id="panel" class="glass"></section>
  <div id="toast"></div>
  <div id="backdrop"></div>
  <aside id="drawer" class="glass"></aside>
  <div id="home">
    <header class="home-top">
      <div class="home-brand"><span class="mark"></span><div><b id="homeTitle"></b><small id="homeSub"></small></div></div>
      <div class="home-tools"><button id="langBtn2" class="tool"></button><button id="soundBtn2" class="tool snd" aria-label="Sound"></button></div>
    </header>
    <div class="tabs" id="homeTabs"></div>
    <main class="home-inner">
      <div id="matchList"></div>
      <div id="venueList"></div>
      <div id="ticketList"></div>
      <p id="homeNote"></p>
      <p class="legal"><a href="./privacy.html">سياسة الخصوصية · Privacy</a></p>
    </main>
  </div>
  <div id="intro">
    <svg class="pitch" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect x="20" y="20" width="360" height="660" /><line x1="20" y1="350" x2="380" y2="350" /><circle class="cc" cx="200" cy="350" r="92" />
      <rect x="100" y="20" width="200" height="96" /><rect x="100" y="584" width="200" height="96" /><circle class="spot" cx="200" cy="350" r="3" />
    </svg>
    <div class="intro-body">
      <p id="introKicker"></p>
      <h1 id="introTitle"></h1>
      <p id="introSub"></p>
      <button id="enterBtn" class="enter"></button>
      <div id="introNext"></div>
    </div>
    <div class="intro-tools"><button id="langBtn3" class="tool"></button></div>
  </div>
  <div id="loader"><div class="spin"></div><p id="loaderText">جاري بناء الملعب…</p></div>
</div>
<script>
// Show start-up problems on screen instead of a blank page.
(function () { function show(m) { var t = document.getElementById('loaderText'); if (t) { t.textContent = '⚠ ' + m; t.style.cssText = 'max-width:80vw;text-align:center;direction:ltr;color:#ffb4b4;font-size:13px'; } }
  addEventListener('error', function (e) { show(e.message || 'Failed to load a script'); }, true);
  addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); }); })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
